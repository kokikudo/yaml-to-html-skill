<!DOCTYPE html>
<!--
  テンプレート: コース一覧（index.html）
  build_lesson_html.py が __TOKEN__ を置換して出力する。手で書き換えるのはこのテンプレート側。
  差し込み口:
    __TITLE__            ページタイトル
    __OVERVIEW_BODY__    概要本文（narration.overview.lead から。受講者向けに書き起こした文章）
    __OVERVIEW_META__    対応環境などのチップ列（空可）
    __SOURCE_NOTE__      出典表記（空可）
    __COURSE_CARDS__     コースカード（views/<course>.html へのリンク）
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --panel-2:#f1f3f7; --border:#e3e6ec;
  --text:#1d2330; --muted:#5b6577; --accent:#2b6cff; --accent-2:#1a9e6b;
  --chip:#eef1f6; --code-bg:#f4f6fa; --warn:#b8730a; --radius:12px;
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a21; --panel-2:#1f232c; --border:#2c313c;
  --text:#e6e9ef; --muted:#9aa3b2; --accent:#5aa9ff; --accent-2:#36c08f;
  --chip:#262b36; --code-bg:#0c0e13; --warn:#e0a33c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",
    "Noto Sans JP",Meiryo,sans-serif;
  line-height:1.85; -webkit-font-smoothing:antialiased;
}
code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;
  background:var(--chip);border:1px solid var(--border);border-radius:5px;padding:1px 5px;
}
.app-header{
  padding:14px 20px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  position:sticky;top:0;z-index:5;
}
.header-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:960px;margin:0 auto;
}
.app-header h1{margin:0;font-size:18px;letter-spacing:.2px}
.theme-toggle{
  flex:none;background:var(--chip);color:var(--text);border:1px solid var(--border);
  border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;
}
.theme-toggle:hover{border-color:var(--accent)}
.theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:960px;margin:0 auto;padding:28px 20px 64px}
section{margin:0 0 44px}
h2{font-size:28px;margin:0 0 14px;letter-spacing:.2px}
h3{font-size:16px;margin:0}
.overview p{margin:0 0 12px;font-size:15.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
.chip{
  background:var(--chip);color:var(--muted);border:1px solid var(--border);
  border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap;
}
.chip.warn{color:var(--warn)}
.note{
  border-left:3px solid var(--warn);background:var(--panel);border-radius:0 8px 8px 0;
  padding:10px 14px;margin:14px 0 0;font-size:14px;
}
.course-list{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.course-card{
  display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;transition:border-color .12s ease, transform .12s ease;
}
.course-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.course-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.course-card .outcome{margin:10px 0 0;color:var(--muted);font-size:14px}
.course-cta{margin:14px 0 0;color:var(--accent);font-size:13px;font-weight:600}
.empty{color:var(--muted);font-size:13px}
.source-note{color:var(--muted);font-size:12px;margin:16px 0 0}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-row">
    <h1>__TITLE__</h1>
    <button class="theme-toggle" type="button" id="theme-toggle" aria-label="テーマ切り替え">🌙 ダーク</button>
  </div>
</header>
<main>
  <section class="overview" aria-labelledby="overview-heading">
    <h2 id="overview-heading">概要</h2>
    __OVERVIEW_BODY__
    __OVERVIEW_META__
    __SOURCE_NOTE__
  </section>

  <section aria-labelledby="courses-heading">
    <h2 id="courses-heading">コース</h2>
    <div class="course-list">
      __COURSE_CARDS__
    </div>
  </section>
</main>
<script>
(function(){
  "use strict";
  // ---- theme (light default; no storage — the theme rides on the link hash) ----
  function currentTheme(){
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }
  function syncLinks(){
    var theme = currentTheme();
    var links = document.querySelectorAll("a.course-card");
    for (var i = 0; i < links.length; i++){
      var base = links[i].getAttribute("href").split("#")[0];
      links[i].setAttribute("href", theme === "dark" ? base + "#theme=dark" : base);
    }
  }
  function readHash(){
    var hash = window.location.hash.replace(/^#/, "");
    var parts = hash.split("&");
    for (var i = 0; i < parts.length; i++){
      var pair = parts[i].split("=");
      if (pair[0] === "theme" && pair[1] === "dark"){ return "dark"; }
    }
    return "light";
  }
  if (readHash() === "dark"){ document.documentElement.setAttribute("data-theme", "dark"); }
  var toggle = document.getElementById("theme-toggle");
  if (toggle){
    toggle.textContent = currentTheme() === "dark" ? "☀ ライト" : "🌙 ダーク";
    toggle.addEventListener("click", function(){
      var dark = currentTheme() === "dark";
      if (dark){ document.documentElement.removeAttribute("data-theme"); }
      else { document.documentElement.setAttribute("data-theme", "dark"); }
      toggle.textContent = dark ? "🌙 ダーク" : "☀ ライト";
      syncLinks();
    });
  }
  syncLinks();
})();
</script>
</body>
</html>
