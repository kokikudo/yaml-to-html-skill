<!DOCTYPE html>
<!--
  テンプレート: レッスン一覧（main.html）
  build_lesson_html.py が __TOKEN__ を置換して出力する。手で書き換えるのはこのテンプレート側。
  差し込み口:
    __TITLE__            ページタイトル
    __OVERVIEW_BODY__    概要本文（narration.overview.lead から。受講者向けに書き起こした文章）
    __OVERVIEW_META__    対応環境などのチップ列（空可）
    __SOURCE_NOTE__      出典表記（空可）
    __LESSON_CARDS__     レッスンカード（lessons/<id>/<id>.html へのリンク）
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f6f7fa; --panel:#ffffff; --panel-2:#eef1f6; --border:#e0e4ec;
  --text:#1d2330; --muted:#5b6577; --accent:#2b6cff; --accent-2:#1a9e6b;
  --chip:#eef1f6; --warn:#b8730a; --radius:12px;
  /* コード面: 明るいモードでは地色より一段沈め、枠で締める */
  --code-bg:#e7ebf2; --code-border:#ced5e0; --code-text:#12182a;
  /* セクションの下地（枠線の色と対で使う） */
  --accent-soft:#eef3ff; --accent-line:#c8d9ff;
  --warn-soft:#fdf5e6;   --warn-line:#f0dcb4;
  --shadow:0 1px 2px rgba(17,24,39,.04), 0 10px 24px -18px rgba(17,24,39,.35);
  /* 和文優先のフォント指定（欧文は各 OS の UI 書体、和文はその OS の標準ゴシック） */
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",
    "Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",
    Roboto,Meiryo,system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,
    "Hiragino Sans","Yu Gothic","Noto Sans Mono CJK JP",monospace;
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a21; --panel-2:#1f232c; --border:#2c313c;
  --text:#e6e9ef; --muted:#9aa3b2; --accent:#5aa9ff; --accent-2:#36c08f;
  --chip:#262b36; --warn:#e0a33c;
  /* コード面: 暗いモードではパネルより一段沈め、枠は逆に明るく */
  --code-bg:#090b10; --code-border:#39414f; --code-text:#eef2f9;
  --accent-soft:#141d2e; --accent-line:#2c4166;
  --warn-soft:#251c0e;   --warn-line:#4d3a17;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 26px -18px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-sans);
  line-height:1.85; letter-spacing:.01em; line-break:strict;
  -webkit-font-smoothing:antialiased;
}
/* 見出しと UI 部品だけ和文の約物を詰める（本文は素のままの方が読みやすい） */
h1,h2,h3,.chip,.lesson-cta{font-feature-settings:"palt" 1}
p,li{overflow-wrap:break-word}
pre,code{letter-spacing:0}
code{
  font-family:var(--font-mono);font-size:.92em;
  background:var(--code-bg);color:var(--code-text);
  border:1px solid var(--code-border);border-radius:5px;padding:1px 5px;
}
.app-header{
  padding:14px 20px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  position:sticky;top:0;z-index:5;
}
.header-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:960px;margin:0 auto;
}
.app-header h1{margin:0;font-size:18px;letter-spacing:.2px}
.theme-toggle{
  flex:none;background:var(--chip);color:var(--text);border:1px solid var(--border);
  border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;
}
.theme-toggle:hover{border-color:var(--accent)}
.theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:960px;margin:0 auto;padding:32px 20px 64px}
/* セクションの切れ目をはっきりさせる: 罫 + 余白 + 見出し頭のアクセント */
main > section + section{margin:38px 0 0;padding-top:32px;border-top:1px solid var(--border)}
section{margin:0}
h2{
  display:flex;align-items:center;gap:11px;
  font-size:24px;margin:0 0 18px;letter-spacing:.2px;
}
h2::before{content:"";flex:none;width:5px;height:1.05em;border-radius:3px;background:var(--accent)}
h3{font-size:17px;margin:0}
/* 概要はカードとして囲み、下のレッスン一覧と地の色で分ける */
.overview{
  background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius);
  padding:22px 24px;box-shadow:var(--shadow);
}
.overview h2{margin:0 0 14px}
.overview p{margin:0 0 12px;font-size:15.5px}
.overview p:last-of-type{margin-bottom:0}
/* 対応環境のような版数の並びは等幅にすると拾いやすい */
.overview > .chips .chip{font-family:var(--font-mono);font-size:11.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
.chip{
  background:var(--chip);color:var(--muted);border:1px solid var(--border);
  border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap;
}
.chip.warn{color:var(--warn)}
.note{
  position:relative;background:var(--warn-soft);border:1.5px solid var(--warn-line);
  border-left:4px solid var(--warn);border-radius:4px 10px 10px 4px;
  padding:11px 14px 11px 44px;margin:14px 0 0;font-size:14px;
}
.note::before{
  content:"!";position:absolute;left:14px;top:13px;width:20px;height:20px;border-radius:50%;
  background:var(--warn);color:#fff;font-size:13px;font-weight:700;line-height:20px;
  text-align:center;
}
/* ダークではアクセントが明るいので、丸の中の文字は暗くする */
:root[data-theme="dark"] .note::before{color:#1c1405}
.note p:last-child{margin-bottom:0}
.lesson-list{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.lesson-card{
  position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;
  background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius);
  padding:20px;overflow:hidden;box-shadow:var(--shadow);
  transition:border-color .12s ease, transform .12s ease, box-shadow .12s ease;
}
.lesson-card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:var(--accent);opacity:0;transition:opacity .12s ease;
}
.lesson-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.lesson-card:hover::before{opacity:1}
.lesson-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lesson-card .outcome{margin:10px 0 0;color:var(--muted);font-size:14px}
.lesson-cta{margin:16px 0 0;color:var(--accent);font-size:13px;font-weight:600}
.empty{color:var(--muted);font-size:13px}
.source-note{color:var(--muted);font-size:12px;margin:16px 0 0}
@media (max-width:640px){
  main{padding:22px 16px 48px}
  .overview{padding:18px 16px}
  h2{font-size:21px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-row">
    <h1>__TITLE__</h1>
    <button class="theme-toggle" type="button" id="theme-toggle" aria-label="テーマ切り替え">🌙 ダーク</button>
  </div>
</header>
<main>
  <section class="overview" aria-labelledby="overview-heading">
    <h2 id="overview-heading">概要</h2>
    __OVERVIEW_BODY__
    __OVERVIEW_META__
    __SOURCE_NOTE__
  </section>

  <section aria-labelledby="lessons-heading">
    <h2 id="lessons-heading">レッスン</h2>
    <div class="lesson-list">
      __LESSON_CARDS__
    </div>
  </section>
</main>
<script>
(function(){
  "use strict";
  // ---- theme (light default; no storage — the theme rides on the link hash) ----
  function currentTheme(){
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }
  function syncLinks(){
    var theme = currentTheme();
    var links = document.querySelectorAll("a.lesson-card");
    for (var i = 0; i < links.length; i++){
      var base = links[i].getAttribute("href").split("#")[0];
      links[i].setAttribute("href", theme === "dark" ? base + "#theme=dark" : base);
    }
  }
  function readHash(){
    var hash = window.location.hash.replace(/^#/, "");
    var parts = hash.split("&");
    for (var i = 0; i < parts.length; i++){
      var pair = parts[i].split("=");
      if (pair[0] === "theme" && pair[1] === "dark"){ return "dark"; }
    }
    return "light";
  }
  if (readHash() === "dark"){ document.documentElement.setAttribute("data-theme", "dark"); }
  var toggle = document.getElementById("theme-toggle");
  if (toggle){
    toggle.textContent = currentTheme() === "dark" ? "☀ ライト" : "🌙 ダーク";
    toggle.addEventListener("click", function(){
      var dark = currentTheme() === "dark";
      if (dark){ document.documentElement.removeAttribute("data-theme"); }
      else { document.documentElement.setAttribute("data-theme", "dark"); }
      toggle.textContent = dark ? "🌙 ダーク" : "☀ ライト";
      syncLinks();
    });
  }
  syncLinks();
})();
</script>
</body>
</html>
